<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>AroLED</title>
<style>
  :root { --bg:#0a0e1e; --card:#161c33; --line:#26304f; --txt:#eef2ff; --sub:#8a94b8; --hi:#4da3ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:18px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  h1 { font-size:22px; margin:6px 0 4px; letter-spacing:.5px; }
  .status { color:var(--sub); font-size:14px; min-height:18px; margin-bottom:14px; }
  button { font:inherit; color:var(--txt); background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:14px; width:100%; font-weight:600; }
  button:active { background:#1f2a4d; }
  button.primary { background:var(--hi); border-color:var(--hi); color:#02101f; }
  button:disabled { opacity:.45; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .dev { display:flex; justify-content:space-between; align-items:center; padding:12px;
    border:1px solid var(--line); border-radius:12px; margin-top:8px; background:#0f1428; }
  .dev small { color:var(--sub); }
  .row { display:flex; align-items:center; justify-content:space-between; margin:16px 0 6px; }
  .row label { font-size:14px; color:var(--sub); }
  .row b { font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:36px; accent-color:var(--hi); }
  .wheelwrap { position:relative; width:230px; max-width:74vw; aspect-ratio:1/1; margin:8px auto 2px; touch-action:none; }
  .wheelwrap canvas { width:100%; height:100%; display:block; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .marker { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.65); pointer-events:none; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
  .modes button { padding:12px; }
  .modes button.on { background:var(--hi); border-color:var(--hi); color:#02101f; }
  .hidden { display:none !important; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#4ade80; margin-right:6px; }
  .inp { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0f1428; color:var(--txt); font:inherit; }
</style>
</head>
<body>
  <h1>AroLED</h1>
  <div class="status" id="status">Buscando el aro…</div>

  <div class="card" id="scanCard">
    <button class="primary" id="btnScan">Buscar por Bluetooth</button>
    <div id="devList"></div>
    <div class="row" style="margin-top:18px"><label>Conexión por WiFi (LAN)</label></div>
    <input class="inp" id="ip" placeholder="IP del aro (p. ej. 192.168.1.106)" inputmode="decimal" autocomplete="off" />
    <div style="margin-top:8px"><button id="btnHttp">Conectar por WiFi</button></div>
    <div style="margin-top:8px"><button id="btnFind">Buscar el aro en la red</button></div>
  </div>

  <div class="card hidden" id="ctlCard">
    <div style="margin-bottom:6px"><span class="dot"></span><b id="devName">AroLED</b> <span id="via"></span></div>
    <div style="margin:10px 0 4px"><button id="btnOn">Apagar LEDs</button></div>

    <div class="row"><label>Modo</label></div>
    <div class="modes" id="modes">
      <button data-m="0">Color fijo</button>
      <button data-m="1" class="on">Arcoíris</button>
      <button data-m="2">Fuego</button>
      <button data-m="3">Cometa</button>
      <button data-m="4">Latido</button>
      <button data-m="5">Destellos</button>
      <button data-m="6">Rebote</button>
      <button data-m="7">Halloween</button>
      <button data-m="8">Navidad</button>
      <button data-m="9">Sinelon</button>
      <button data-m="10">Juggle</button>
      <button data-m="11">Confeti</button>
      <button data-m="12">Cylon</button>
      <button data-m="13">Meteoro</button>
      <button data-m="14">Centelleo</button>
      <button data-m="15">Pride</button>
      <button data-m="16">Vela</button>
      <button data-m="17">Rayo</button>
      <button data-m="18">Policía</button>
      <button data-m="19">Purpurina</button>
      <button data-m="20">Pacifica</button>
      <button data-m="21">Espectro</button>
      <button data-m="22">Aleatorio</button>
      <button data-m="23">Nocturno</button>
    </div>

    <div id="colorBlock">
    <div class="row"><label>Color</label></div>
    <div class="wheelwrap" id="wheelWrap">
      <canvas id="wheel" width="240" height="240"></canvas>
      <div class="marker" id="marker"></div>
    </div>
    </div>

    <div class="row"><label>Brillo</label><b id="vBright">40</b></div>
    <input type="range" id="bright" min="5" max="100" value="40" />

    <div id="speedBlock">
      <div class="row"><label>Velocidad</label><b id="vSpeed">50</b></div>
      <input type="range" id="speed" min="0" max="100" value="50" />
    </div>

    <div class="row" style="margin-top:20px"><label>WiFi del ESP32</label></div>
    <input class="inp" id="ssid" placeholder="Nombre de la red (SSID)" autocomplete="off" autocapitalize="none" />
    <input class="inp" id="pass" type="password" placeholder="Contraseña WiFi" autocomplete="off" style="margin-top:8px" />
    <input id="staticip" placeholder="IP fija del aro (opcional, p. ej. 192.168.1.150)" inputmode="decimal" autocomplete="off"
      style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f1428;color:var(--txt);font:inherit;margin-top:8px" />
    <div style="margin-top:10px"><button id="btnWifi">Guardar y conectar WiFi</button></div>
    <div style="margin-top:8px"><button id="btnUpd">Buscar actualización del ESP32</button></div>
    <div style="margin-top:8px"><button id="btnReboot">Reiniciar ESP32</button></div>
    <div class="status" id="net" style="margin-top:12px"><span class="dot"></span>estado: —</div>
    <div class="status" id="versions">app v— · ESP v—</div>

    <div class="row" style="margin-top:20px"><label>Conexión del aro</label></div>
    <div style="margin-top:4px"><button id="btnMode">Pasar a WiFi (LAN)</button></div>

    <div class="row" style="margin-top:20px"><label>Luz nocturna (horario)</label></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <label style="flex:1;font-size:13px;color:var(--sub)">Encender<br><input id="nightOn" type="time" value="21:00" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0f1428;color:var(--txt);font:inherit"></label>
      <label style="flex:1;font-size:13px;color:var(--sub)">Apagar<br><input id="nightOff" type="time" value="07:00" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0f1428;color:var(--txt);font:inherit"></label>
    </div>
    <div class="row"><label>Brillo nocturno</label><b id="vNight">12</b></div>
    <input type="range" id="nightBright" min="1" max="60" value="12" />
    <div style="margin-top:8px"><button id="btnNight">Guardar horario</button></div>
    <div style="margin-top:8px"><button id="btnNightOff">Desactivar luz nocturna</button></div>
    <div class="status" id="nightInfo">—</div>

    <div style="margin-top:16px"><button id="btnDisc">Desconectar</button></div>
  </div>

  <script>
  (function () {
    "use strict";
    var SERVICE = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890ab";
    var CH_BRIGHT = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a1";
    var CH_SPEED  = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a2";
    var CH_HUE    = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a3";
    var CH_MODE   = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a4";
    var CH_SAT    = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a5";
    var CH_CMD    = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a6";
    var CH_STAT   = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a7";
    var CH_VER    = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a8";
    var CH_ON     = "a0e1e0a0-1b1c-4a2b-8c3d-1234567890a9";
    var NAME = "AroLED";

    var $ = function (id) { return document.getElementById(id); };

    // Version de la app (inyectada por MainActivity en la app nativa; "web" si no).
    function appVersion() {
      try {
        if (window.AndroidApp && window.AndroidApp.getVersionName) return window.AndroidApp.getVersionName();
      } catch (e) {}
      return "web";
    }
    function showVersions(esp) {
      $("versions").textContent = "app v" + appVersion() + " · ESP v" + (esp || "—");
    }

    // WiFi: recordar la ultima red y autocompletar el SSID actual del movil.
    // (Android no permite leer la contrasena guardada; solo el nombre de la red.)
    function loadWifi() {
      try {
        var s = localStorage.getItem("wifi_ssid") || "";
        var p = localStorage.getItem("wifi_pass") || "";
        if (s) $("ssid").value = s;
        if (p) $("pass").value = p;
      } catch (e) {}
    }
    function fillSsidFromPhone() {
      try {
        if ($("ssid").value) return;
        if (window.AndroidApp && window.AndroidApp.getSsid) {
          var s = window.AndroidApp.getSsid();
          if (s && s.length) $("ssid").value = s;
        }
      } catch (e) {}
    }
    function saveWifi(s, p) {
      try {
        localStorage.setItem("wifi_ssid", s);
        localStorage.setItem("wifi_pass", p);
      } catch (e) {}
    }

    var BLE = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BluetoothLe) ||
              (window.Capacitor && window.Capacitor.registerPlugin && window.Capacitor.registerPlugin("BluetoothLe"));

    var deviceId = null;
    var scanListener = null;
    var found = {};
    var curHue = 0, curSat = 255;

    // ---------------- transporte: BLE o HTTP (LAN) ----------------
    var MODE = "ble";     // "ble" | "http"
    var httpBase = "";    // "http://<ip>"
    function isHttp() { return MODE === "http" && !!httpBase; }
    function loadIp() { try { return localStorage.getItem("aro_ip") || ""; } catch (e) { return ""; } }
    function saveIp(ip) { try { localStorage.setItem("aro_ip", ip); } catch (e) {} }

    function httpReq(path, ms) {
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, ms || 2500);
      return fetch(httpBase + path, { signal: ctrl.signal })
        .then(function (r) { clearTimeout(t); return r.ok ? r.json() : null; })
        .catch(function () { clearTimeout(t); return null; });
    }

    function setStatus(t) { $("status").textContent = t; }
    function hexByte(v) { return (v & 0xff).toString(16).padStart(2, "0"); }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // ---- escritura BLE "en vivo" con throttle por característica ----
    var queue = {}, sending = {};
    function writeLive(char, value) {
      if (!deviceId) return;
      queue[char] = value;
      if (!sending[char]) sendLoop(char);
    }
    async function sendLoop(char) {
      sending[char] = true;
      while (queue[char] !== undefined) {
        var v = queue[char]; queue[char] = undefined;
        try {
          await BLE.write({ deviceId: deviceId, service: SERVICE, characteristic: char, value: hexByte(v) });
        } catch (e) { /* ignore transient write errors */ }
        await sleep(25);
      }
      sending[char] = false;
    }

    // Aplica un parametro por el transporte activo.
    function applyParam(k, v) {
      if (isHttp()) { httpReq("/api/set?" + k + "=" + v, 2000); return; }
      if (k === "mode") writeLive(CH_MODE, v);
      else if (k === "bright") writeLive(CH_BRIGHT, v);
      else if (k === "speed") writeLive(CH_SPEED, v);
      else if (k === "hue") writeLive(CH_HUE, v);
      else if (k === "sat") writeLive(CH_SAT, v);
      else if (k === "on") writeLive(CH_ON, v);
    }

    // ---- rueda de color circular (Hue=angulo, Sat=radio) ----
    function hsv2rgb(h, s, v) {
      h = ((h % 360) + 360) % 360;
      var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r, g, b;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }
      return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }

    function drawWheel() {
      var cv = $("wheel"), ctx = cv.getContext("2d"), n = cv.width, R = n / 2;
      var img = ctx.createImageData(n, n), d = img.data;
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
        var dx = x - R + 0.5, dy = y - R + 0.5, dist = Math.sqrt(dx * dx + dy * dy), i = (y * n + x) * 4;
        if (dist <= R) {
          var ang = Math.atan2(dy, dx) * 180 / Math.PI; if (ang < 0) ang += 360;
          var rgb = hsv2rgb(ang, Math.min(1, dist / R), 1);   // centro blanco -> borde saturado
          d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
        } else { d[i + 3] = 0; }
      }
      ctx.putImageData(img, 0, 0);
    }

    function hueSatFromEvent(e) {
      var cv = $("wheel"), r = cv.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1;
      var dist = Math.sqrt(x * x + y * y);
      var sat = Math.max(0, Math.min(1, dist)) * 255;
      var ang = Math.atan2(y, x) * 180 / Math.PI; if (ang < 0) ang += 360;
      if (x === 0 && y === 0) ang = 0;
      return { hue: Math.round(ang / 360 * 255) & 255, sat: Math.round(sat) };
    }

    function placeMarker() {
      var cv = $("wheel"), R = cv.width / 2;
      var ang = curHue / 255 * 360 * Math.PI / 180, rr = R * (curSat / 255);
      var x = R + Math.cos(ang) * rr, y = R + Math.sin(ang) * rr, m = $("marker");
      m.style.left = (x / cv.width * 100) + "%";
      m.style.top = (y / cv.height * 100) + "%";
      var rgb = hsv2rgb(curHue / 255 * 360, curSat / 255, 1);
      m.style.background = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    }

    function pickColor(e) {
      var hsv = hueSatFromEvent(e);
      curHue = hsv.hue; curSat = hsv.sat;
      placeMarker();
      setMode(0);
      applyParam("hue", curHue);
      applyParam("sat", curSat);
    }

    function renderList() {
      var list = $("devList");
      list.innerHTML = "";
      Object.keys(found).forEach(function (id) {
        var d = found[id];
        var div = document.createElement("div");
        div.className = "dev";
        div.innerHTML = "<div><b>" + (d.name || NAME) + "</b><br><small>" +
          (d.rssi != null ? d.rssi + " dBm" : "") + "</small></div><div>›</div>";
        div.onclick = function () { connect(id, d.name); };
        list.appendChild(div);
      });
    }

    async function startScan() {
      try {
        $("btnScan").disabled = true;
        setStatus("Pidiendo permisos…");
        await BLE.initialize({ androidNeverForLocation: true });
        var en = await BLE.isEnabled();
        if (!en.value) { await BLE.requestEnable(); }

        var ens = await BLE.isEnabled();
        if (!ens.value) { setStatus("Activa el Bluetooth del móvil y reintenta."); $("btnScan").disabled = false; return; }

        setStatus("Buscando por Bluetooth… enciende el aro si no aparece.");
        found = {}; renderList();
        if (!scanListener) {
          scanListener = await BLE.addListener("onScanResult", function (res) {
            var nm = res.localName || (res.device && res.device.name) || "";
            if (nm !== NAME) return;
            found[res.device.deviceId] = { name: nm, rssi: res.rssi };
            renderList();
          });
        }
        await BLE.requestLEScan({ allowDuplicates: false });
      } catch (e) {
        setStatus("Error al buscar: " + (e && e.message ? e.message : e));
        $("btnScan").disabled = false;
      }
    }

    async function connect(id, name) {
      try { await BLE.stopLEScan(); } catch (e) {}
      var lastErr = null;
      for (var attempt = 1; attempt <= 3; attempt++) {
        try {
          setStatus("Conectando… (intento " + attempt + "/3)");
          try { await BLE.disconnect({ deviceId: id }); } catch (e) {}
          await BLE.connect({ deviceId: id, timeout: 20000 });
          await BLE.discoverServices({ deviceId: id });
          deviceId = id;
          MODE = "ble"; httpBase = "";
          $("devName").textContent = name || NAME;
          $("via").textContent = "(Bluetooth)";
          $("scanCard").classList.add("hidden");
          $("ctlCard").classList.remove("hidden");
          setStatus("Conectado por Bluetooth.");
          refreshModeBtn();
          startStatPoll();
          readVer();
          fillSsidFromPhone();
          return;
        } catch (e) {
          lastErr = e;
          try { await BLE.disconnect({ deviceId: id }); } catch (x) {}
          await sleep(1200);
        }
      }
      setStatus("No se pudo conectar tras 3 intentos: " + (lastErr && lastErr.message ? lastErr.message : lastErr));
    }

    // Conecta por WiFi (LAN). Devuelve true si el aro responde.
    async function connectHttp(ip) {
      if (!ip) return false;
      var prev = httpBase;
      httpBase = "http://" + ip;
      var st = await httpReq("/api/state", 3000);
      if (!st) { httpBase = prev; return false; }
      MODE = "http"; saveIp(ip);
      $("devName").textContent = "AroLED";
      $("via").textContent = "(WiFi " + ip + ")";
      $("scanCard").classList.add("hidden");
      $("ctlCard").classList.remove("hidden");
      setStatus("Conectado por WiFi (" + ip + ").");
      showVersions(st.ver);
      applyState(st);
      refreshModeBtn();
      startStatPoll();
      return true;
    }

    // Sondea una IP concreta buscando el aro (campo "dev").
    async function probeState(base, ms) {
      try {
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, ms);
        var r = await fetch(base + "/api/state", { signal: ctrl.signal });
        clearTimeout(t);
        if (!r.ok) return null;
        return await r.json();
      } catch (e) { return null; }
    }
    // Escanea la LAN (.1-.254) en lotes buscando el aro por su campo "dev".
    async function scanLan() {
      setStatus("Buscando el aro en la red…");
      var base = (loadIp() || "192.168.1.1").split(".").slice(0, 3).join(".") + ".";
      var found = null;
      for (var start = 1; start <= 254 && !found; start += 64) {
        var batch = [];
        for (var h = start; h < start + 64 && h <= 254; h++) {
          batch.push((function (host) {
            return probeState("http://" + base + host, 800).then(function (st) {
              if (!found && st && st.dev === "AroLED") found = base + host;
            });
          })(h));
        }
        await Promise.all(batch);
      }
      return found;
    }

    function applyState(st) {
      if (st.on != null) setOnUI(!!st.on);
      if (st.mode != null) setModeUI(st.mode);
      if (st.bright != null) { $("bright").value = st.bright; $("vBright").textContent = st.bright; }
      if (st.speed != null) { $("speed").value = st.speed; $("vSpeed").textContent = st.speed; }
      if (st.hue != null) curHue = st.hue;
      if (st.sat != null) { curSat = st.sat; placeMarker(); }
      if (st.night != null) showNight(st.night);
    }

    async function disconnect() {
      if (isHttp()) {
        MODE = "ble"; httpBase = ""; stopStatPoll();
      } else {
        try { if (deviceId) await BLE.disconnect({ deviceId: deviceId }); } catch (e) {}
        deviceId = null; stopStatPoll();
      }
      $("ctlCard").classList.add("hidden");
      $("scanCard").classList.remove("hidden");
      $("btnScan").disabled = false;
      setStatus("Desconectado.");
    }

    // ---- controles ----
    var modeBtns = Array.prototype.slice.call(document.querySelectorAll("#modes button"));
    function setModeUI(m) {
      modeBtns.forEach(function (b) { b.classList.toggle("on", +b.dataset.m === m); });
      $("speedBlock").classList.toggle("hidden", m === 0);
      $("colorBlock").classList.toggle("hidden", m !== 0);
    }
    function setMode(m) { setModeUI(m); applyParam("mode", m); }
    modeBtns.forEach(function (b) {
      b.onclick = function () { setMode(+b.dataset.m); };
    });

    // Encendido/apagado de los LEDs.
    var isOn = true;
    function setOnUI(v) {
      isOn = !!v;
      $("btnOn").textContent = isOn ? "Apagar LEDs" : "Encender LEDs";
    }
    function setOn(v) { setOnUI(v); applyParam("on", isOn ? 1 : 0); }
    $("btnOn").onclick = function () { setOn(!isOn); };

    var wheelWrap = $("wheelWrap");
    wheelWrap.addEventListener("pointerdown", function (e) {
      try { wheelWrap.setPointerCapture(e.pointerId); } catch (x) {}
      wheelWrap.dataset.drag = "1"; pickColor(e);
    });
    wheelWrap.addEventListener("pointermove", function (e) { if (wheelWrap.dataset.drag) pickColor(e); });
    wheelWrap.addEventListener("pointerup", function () { wheelWrap.dataset.drag = ""; });
    wheelWrap.addEventListener("pointercancel", function () { wheelWrap.dataset.drag = ""; });
    drawWheel(); placeMarker();
    $("bright").oninput = function (e) { $("vBright").textContent = e.target.value; applyParam("bright", +e.target.value); };
    $("speed").oninput = function (e) { $("vSpeed").textContent = e.target.value; applyParam("speed", +e.target.value); };

    // ---- comandos al ESP32 por BLE (WiFi / OTA / modo) ----
    function bytesToHex(arr) {
      var s = "";
      for (var i = 0; i < arr.length; i++) s += hexByte(arr[i]);
      return s;
    }
    function hexToBytes(h) {
      var out = [];
      for (var i = 0; i + 1 < h.length; i += 2) out.push(parseInt(h.substr(i, 2), 16));
      return out;
    }

    async function sendCmd(str) {
      if (!deviceId) return;
      var bytes = Array.prototype.slice.call(new TextEncoder().encode(str));
      var CH = 18;
      for (var i = 0; i < bytes.length; i += CH) {
        var part = bytes.slice(i, i + CH);
        if (i + CH >= bytes.length) part.push(0);
        try {
          await BLE.write({ deviceId: deviceId, service: SERVICE, characteristic: CH_CMD, value: bytesToHex(part) });
        } catch (e) { /* ignore */ }
      }
    }

    var statTimer = null;
    async function readStat() {
      if (isHttp()) {
        var st = await httpReq("/api/state", 2000);
        if (st) {
          $("net").innerHTML = '<span class="dot"></span>estado: ' + (st.net || "—") +
            (st.ssid ? (" · " + st.ssid) : "") +
            (st.netmode ? (" · " + st.netmode) : "");
          showVersions(st.ver);
        }
        return;
      }
      if (!deviceId) return;
      try {
        var r = await BLE.read({ deviceId: deviceId, service: SERVICE, characteristic: CH_STAT });
        var b = hexToBytes((r && r.value) || "");
        var t = "";
        for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]);
        $("net").innerHTML = '<span class="dot"></span>estado: ' + (t || "—");
      } catch (e) { /* ignore */ }
      try {
        var ro = await BLE.read({ deviceId: deviceId, service: SERVICE, characteristic: CH_ON });
        var bo = hexToBytes((ro && ro.value) || "");
        if (bo.length) setOnUI(!!bo[0]);
      } catch (e) { /* ignore */ }
    }
    async function readVer() {
      if (isHttp() || !deviceId) return;
      try {
        var r = await BLE.read({ deviceId: deviceId, service: SERVICE, characteristic: CH_VER });
        var b = hexToBytes((r && r.value) || "");
        var t = "";
        for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]);
        showVersions(t || "—");
      } catch (e) { showVersions("—"); }
    }
    function startStatPoll() { stopStatPoll(); statTimer = setInterval(readStat, 1500); readStat(); }
    function stopStatPoll() { if (statTimer) { clearInterval(statTimer); statTimer = null; } }

    // El aro reinicia para aplicar WiFi/OTA: reconectar solo cuando vuelva.
    async function waitReconnect() {
      if (!deviceId) return;
      var id = deviceId;
      setStatus("El aro se está reiniciando… esperando a que vuelva.");
      for (var i = 0; i < 14; i++) {
        await sleep(3000);
        try {
          try { await BLE.disconnect({ deviceId: id }); } catch (e) {}
          await BLE.connect({ deviceId: id, timeout: 15000 });
          await BLE.discoverServices({ deviceId: id });
          setStatus("Reconectado.");
          startStatPoll();
          readVer();
          return;
        } catch (e) { /* sigue esperando */ }
      }
      setStatus("No volvió a responder. Pulsa buscar para reconectar.");
      stopStatPoll();
    }

    // ---- cambio de modo del aro: BLE <-> WiFi ----
    function refreshModeBtn() {
      $("btnMode").textContent = isHttp() ? "Volver a Bluetooth" : "Pasar a WiFi (LAN)";
    }
    async function switchToWifi() {
      if (isHttp()) return;
      if (!deviceId) { setStatus("Conecta primero por Bluetooth."); return; }
      sendCmd("M\twifi");
      setStatus("El aro pasa a WiFi… buscando su IP.");
      var ip = $("ip").value.trim() || loadIp();
      var end = Date.now() + 25000;
      while (Date.now() < end) {
        await sleep(3000);
        if (ip && await connectHttp(ip)) { $("ip").value = ip; return; }
      }
      var f = await scanLan();
      if (f && await connectHttp(f)) { $("ip").value = f; return; }
      setStatus("El aro está en modo WiFi. Escribe su IP y pulsa «Conectar por WiFi».");
      deviceId = null;
      $("ctlCard").classList.add("hidden");
      $("scanCard").classList.remove("hidden");
      $("btnScan").disabled = false;
    }
    async function switchToBle() {
      if (!isHttp()) return;
      await httpReq("/api/mode?set=ble", 2000);
      MODE = "ble"; httpBase = ""; stopStatPoll();
      $("ctlCard").classList.add("hidden");
      $("scanCard").classList.remove("hidden");
      $("btnScan").disabled = false;
      setStatus("El aro vuelve a Bluetooth. Buscando…");
      startScan();
    }

    $("btnWifi").onclick = async function () {
      var s = $("ssid").value, p = $("pass").value;
      var fix = ($("staticip") && $("staticip").value.trim()) || "";
      saveWifi(s, p);
      if (isHttp()) {
        $("net").innerHTML = '<span class="dot"></span>estado: wifi:enviando…';
        await httpReq("/api/wifi?add=" + encodeURIComponent(s) + "&pass=" + encodeURIComponent(p) + (fix ? "&static=" + encodeURIComponent(fix) : ""), 4000);
      } else {
        sendCmd("W\t" + s + "\t" + p + (fix ? "\t" + fix : ""));
        $("net").innerHTML = '<span class="dot"></span>estado: wifi:enviando…';
        waitReconnect();
      }
    };
    $("btnUpd").onclick = async function () {
      if (isHttp()) {
        $("net").innerHTML = '<span class="dot"></span>estado: ota:enviando…';
        await httpReq("/api/ota", 4000);
      } else {
        sendCmd("U"); $("net").innerHTML = '<span class="dot"></span>estado: ota:enviando…'; waitReconnect();
      }
    };
    $("btnReboot").onclick = async function () {
      if (isHttp()) { await httpReq("/api/reboot", 2000); }
      else { sendCmd("R"); waitReconnect(); }
    };

    $("btnMode").onclick = function () { isHttp() ? switchToBle() : switchToWifi(); };
    $("btnHttp").onclick = function () {
      var ip = $("ip").value.trim();
      if (!ip) { setStatus("Escribe la IP del aro."); return; }
      connectHttp(ip).then(function (ok) { if (!ok) setStatus("No responde en " + ip + "."); });
    };
    $("btnFind").onclick = async function () {
      var ip = await scanLan();
      if (!ip) { setStatus("No se encontró el aro en la red. ¿Está en modo WiFi?"); return; }
      $("ip").value = ip;
      if (!await connectHttp(ip)) setStatus("Encontrado en " + ip + " pero no responde.");
    };
    $("btnScan").onclick = startScan;
    $("btnDisc").onclick = disconnect;

    // ---- luz nocturna (horario) ----
    function showNight(s) {
      var p = (s || "").split("|");
      if (p.length < 4) { $("nightInfo").textContent = "—"; return; }
      if (p[0]) $("nightOn").value = p[0];
      if (p[1]) $("nightOff").value = p[1];
      if (p[2]) { $("nightBright").value = p[2]; $("vNight").textContent = p[2]; }
      $("nightInfo").textContent = (p[3] === "1") ? ("Activa " + p[0] + "–" + p[1]) : "Desactivada";
    }
    async function saveNight(enabled) {
      var on = $("nightOn").value || "21:00", off = $("nightOff").value || "07:00", b = $("nightBright").value || 12;
      if (!isHttp()) { setStatus("El horario necesita el aro en modo WiFi (LAN)."); return; }
      var st = await httpReq("/api/night?on=" + encodeURIComponent(on) + "&off=" + encodeURIComponent(off) + "&bright=" + b + "&enabled=" + enabled, 3000);
      if (st) showNight(st.night);
      setStatus(enabled ? "Horario guardado." : "Luz nocturna desactivada.");
    }
    $("nightBright").oninput = function () { $("vNight").textContent = $("nightBright").value; };
    $("btnNight").onclick = function () { saveNight(1); };
    $("btnNightOff").onclick = function () { saveNight(0); };

    // Al abrir: intenta WiFi (si hay IP guardada) y si no, Bluetooth.
    window.addEventListener("load", function () {
      showVersions();
      loadWifi();
      $("ip").value = loadIp();
      setTimeout(fillSsidFromPhone, 1200);
      (async function () {
        var ip = loadIp();
        if (ip && await connectHttp(ip)) return;
        startScan();
      })();
    });
  })();
  </script>
</body>
</html>
